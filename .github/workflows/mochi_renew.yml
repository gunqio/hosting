name: Auto Renew Mochi

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,13 * * *'

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/hosting-aida0710.py hosting-aida0710.py

      - name: 🐍 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk wget python3-tk python3-dev
          pip install seleniumbase requests --quiet
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "🌐 未配置 NODE_LINK，使用直连"
            exit 0
          fi
          echo "🔗 代理协议: ${NODE_LINK%%://*}"
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: "true"
          PROXY_SERVER: "http://127.0.0.1:1081"
        run: |
          xvfb-run -a python3 hosting-aida0710.py

      - name: 📤 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3

      - name: 🧽 清理
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f "hosting-aida0710.py" || true
          rm -f sing-box sing-box-config.json sing-box.log hosting-aida0710.py ./*.png

      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo ${{ github.repository }} --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id --repo ${{ github.repository }} || true
            fi
          done
