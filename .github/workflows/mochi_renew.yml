name: Auto Renew Mochi
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,13 * * *'
  
permissions:
  actions: write
  contents: read
  
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/hosting-aida0710.py hosting-aida0710.py

      - name: 🐍 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk wget python3-tk python3-dev
          pip install seleniumbase requests --quiet
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "🌐 未配置 NODE_LINK，使用直连"
            exit 0
          fi
          echo "🔗 代理协议: ${NODE_LINK%%://*}"
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: "true"
          PROXY_SERVER: "http://127.0.0.1:1081"
        run: |
          xvfb-run --auto-servernum python3 hosting-aida0710.py

      # ================== 新增：上传调试截图 ==================
      - name: 📸 上传调试截图（如有）
        if: always()   # 无论脚本成功或失败都执行，确保能捕获失败时的截图
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          # 请确保您的 Python 脚本会生成以下文件（例如在登录失败或异常时调用 driver.save_screenshot()）
          path: |
            login_error_screenshot.png
            exception_screenshot.png
            page_source.html
            exception_page.html
            *.png
            *.html
          retention-days: 7
      # =====================================================

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          pkill -f python || true
          rm -f sing-box sing-box-config.json sing-box.log hosting-aida0710.py
          # 截图文件已上传，可以删除以节省空间（可选）
          rm -f *.png *.html

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo ${{ github.repository }} --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id --repo ${{ github.repository }} || true
            fi
          done
